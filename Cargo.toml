[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Afsall Labs"]
repository = "https://github.com/afsall-labs/montrs"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
anyhow = "1.0"
tracing = "0.1"
futures = "0.3"
# leptos is mode-agnostic here; each consumer enables csr/hydrate/ssr via its
# own [features] so feature unification can never leak `ssr` into WASM
# hydrate/CSR builds (tachys skips event handlers when `ssr` is active, which
# silently kills all client-side interactivity).
leptos = "0.8"
leptos_axum = "0.8"
leptos_meta = "0.8"
leptos_router = "0.8"
regex = "1.10"
strum = { version = "0.28", features = ["derive"] }
strum_macros = "0.28"
convert_case = "0.11"
tw_merge = "0.1"
paste = "1"
open = "5"
# Pinned to <2.0.4 because 2.0.4+ requires rustc 1.96.0, but our toolchain is 1.95.0-nightly
kstring = "=2.0.2"

# The website crate (a Leptos SSR app that monomorphizes 1600+ icons and the
# full ui/motion stack) produces a >7 GB rlib at opt-level 0 in dev builds.
# MSVC link.exe cannot consume archives above ~4 GB and reports
# "invalid library format; library ignored", breaking `montrs serve`.
# Optimizing this crate and trimming its debuginfo keeps the dev rlib under
# that limit and linkable.
[profile.dev.package.website]
opt-level = 2
debug = "line-tables-only"