[project]
name = "todo-example"
version = "0.1.0"

[serve]
site-addr = "0.0.0.0:3000"
reload-port = 3001
tailwind-input-file = "style/main.css"
site-root = "target/site"
site-pkg-dir = "pkg"
output-name = "front"
assets-dir = "assets"
lib-features = ["hydrate"]
lib-default-features = false

[build]
target = "index.html"

[env]
MONTRS_LOG = "info"
DATABASE_URL = "sqlite:./data/todo.db"

[services.db]
run = "sqlite3 ./data/todo.db"
auto = "start-stop"
ready_port = { port = 3000 }

[services.api]
run = "cargo run"
auto = "start-stop"
ready_http = { url = "http://127.0.0.1:3000/ok", expected-status = 200 }
depends = []

[tasks]
fmt = { command = "cargo fmt --all", category = "Quality" }
lint = { command = "cargo clippy -- -D warnings", category = "Quality" }
test = { command = "cargo test", category = "Testing" }

[tools]
tailwindcss = "4"
wasm-bindgen = "0.2"
