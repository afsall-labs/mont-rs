[package]
name = "app"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "app-ssr"
path = "src/main.rs"
required-features = ["ssr"]

[dependencies]
montrs-core = { path = "../../../packages/core" }
montrs-validator = { path = "../../../packages/validator" }
montrs-orm = { path = "../../../packages/orm" }
montrs-test = { path = "../../../packages/test" }
montrs-ui = { path = "../../../packages/ui" }
montrs-icons = { path = "../../../packages/icons" }
montrs-state = { path = "../../../packages/state" }
montrs-table-core = { path = "../../../packages/table-core" }
montrs-hotkeys-core = { path = "../../../packages/hotkeys-core" }
leptos = { version = "0.8" }
leptos_meta = { version = "0.8" }
leptos_router = { version = "0.8" }
tokio = { version = "1", features = ["rt", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
anyhow = "1"
thiserror = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
tokio-postgres = "0.7"
tw_merge = "0.1"
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement"] }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

[features]
default = []
hydrate = ["leptos/hydrate"]
ssr = [
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
    "tokio/full",
    "montrs-core/ssr",
    "dep:tracing",
    "dep:tracing-subscriber",
]

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
