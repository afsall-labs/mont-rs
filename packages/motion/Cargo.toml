[package]
name = "montrs-motion"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Animation library for MontRS — spring physics, tweening, gestures, SVG, and video"

[package.metadata.montrs]
layer = "2"
allowed_deps = ["montrs-core"]

[dependencies]
montrs-core = { path = "../core" }
leptos.workspace = true
serde.workspace = true
thiserror.workspace = true
web-sys = { version = "0.3", features = ["Window", "Performance"] }
wasm-bindgen = "0.2"
tempfile = "3.10"
resvg = { version = "0.44", optional = true }
usvg = { version = "0.44", optional = true }
tiny-skia = { version = "0.11", optional = true }

[features]
default = ["csr"]
csr = ["leptos/csr"]
video = ["dep:resvg", "dep:usvg", "dep:tiny-skia"]