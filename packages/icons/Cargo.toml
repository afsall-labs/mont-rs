[package]
name = "montrs-icons"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Lucide icons for MontRS applications — 1600+ icons with category-based features"

[package.metadata.montrs]
layer = "2"
allowed_deps = ["montrs-motion"]

[dependencies]
leptos.workspace = true
strum = { workspace = true, features = ["derive"] }
strum_macros.workspace = true
convert_case.workspace = true
montrs-motion = { path = "../motion", optional = true }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["CssStyleDeclaration", "Element", "HtmlCollection", "SvgCircleElement", "SvgElement", "SvgEllipseElement", "SvgGeometryElement", "SvgLineElement", "SvgPathElement", "SvgPolygonElement", "SvgPolylineElement", "SvgRectElement", "Window"] }

[features]
accessibility = []
account = []
animals = []
arrows = []
animated = ["dep:montrs-motion"]
buildings = []
charts = []
communication = []
connectivity = []
cursors = []
csr = ["leptos/csr"]
# Additional icon collections (license-safe MIT/Apache-2.0), generated by
# montrs-icons-codegen. Enable whichever you want to embed.
col-radix = []
col-tabler = []
col-iconoir = []
col-phosphor = []
col-mdi = []
default = [
    "accessibility", "account", "animals", "arrows", "buildings",
    "charts", "communication", "connectivity", "cursors",
    "design", "development", "devices", "emoji", "files",
    "finance", "food_beverage", "gaming", "home", "layout",
    "mail", "math", "medical", "multimedia", "nature",
    "navigation", "notifications", "people", "photography",
    "science", "seasons", "security", "shapes", "shopping",
    "social", "sports", "sustainability", "text", "time",
    "tools", "transportation", "travel", "weather",
    "csr",
]
design = []
development = []
devices = []
emoji = []
files = []
finance = []
food_beverage = []
gaming = []
home = []
layout = []
mail = []
math = []
medical = []
multimedia = []
nature = []
navigation = []
notifications = []
people = []
photography = []
science = []
seasons = []
security = []
shapes = []
shopping = []
social = []
sports = []
sustainability = []
text = []
time = []
tools = []
transportation = []
travel = []
weather = []

[lib]
bench = false